<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15131d">
<title>Riddle Maze · Critical Puzzles</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --stage: #15131d; --stage-lift: #2e2945; --panel: #1d1a28; --ink: #efecf7; --muted: #a8a2bd;
  --line: rgba(239, 236, 247, 0.2); --tile: rgba(239, 236, 247, 0.07); --accent: #ea4fae;
  --amber: #f0b03a; --good: #5fd0a0;
  --display: "Unbounded", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--stage); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4;
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
#app { position: relative; height: 100%;
  background: radial-gradient(ellipse 70% 60% at 50% 46%, var(--stage-lift), var(--stage) 72%); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#app[data-screen="setup"] #view { pointer-events: none; }
button, .btn {
  font: 600 14px/1 var(--body); letter-spacing: 0.02em; color: var(--ink); background: var(--tile);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; cursor: pointer; text-decoration: none;
  display: inline-block;
}
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: #1b0b16; border-color: transparent; }
.label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

/* Setup */
#setup {
  position: absolute; inset: 0; overflow-y: auto; padding: calc(18px + var(--safe-t)) 20px calc(20px + var(--safe-b));
  display: flex; flex-direction: column; gap: 16px;
}
#app:not([data-screen="setup"]) #setup { display: none; }
#setup h1 { margin: 6px 0 0; font-family: var(--display); font-weight: 700; text-transform: uppercase;
  font-size: clamp(28px, 8vw, 52px); line-height: 1; }
#setup h1 span { display: block; color: var(--accent); }
#setup .lede { margin: 0; color: var(--muted); max-width: 44ch; }
.group { max-width: 520px; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { padding: 10px 13px; border-radius: 999px; font-size: 13px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: #15131d; border-color: transparent; }
.hint { margin: 0; color: var(--muted); font-size: 13px; max-width: 48ch; }
@media (min-width: 820px) { #setup { padding-right: 50%; justify-content: center; } }

/* Play */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + var(--safe-t)) 12px 0;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
#hud > * { pointer-events: auto; }
#hud button, #hud .btn { padding: 10px 12px; font-size: 13px; background: rgba(29, 26, 40, 0.85); }
#stats { display: flex; gap: 14px; margin: 0 0 0 auto; padding: 8px 12px; border-radius: 12px; background: rgba(29, 26, 40, 0.85);
  border: 1px solid var(--line); }
#stats div { display: flex; flex-direction: column; align-items: center; }
#stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
#status { position: absolute; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); margin: 0; text-align: center;
  color: var(--muted); font-size: 13.5px; pointer-events: none; text-shadow: 0 1px 6px #000; }
#app[data-screen="setup"] #hud, #app[data-screen="setup"] #status { display: none; }

.card { position: absolute; left: 12px; right: 12px; top: calc(64px + var(--safe-t)); margin: 0 auto; max-width: 480px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; z-index: 5;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); max-height: calc(100% - 90px); overflow-y: auto; }
.card h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 500; font-size: 15px; }
.card p { margin: 6px 0; }
#riddle-text { font-size: 17px; line-height: 1.45; -webkit-user-select: text; user-select: text; }
.cluebox { border-left: 3px solid var(--good); padding: 6px 10px; background: var(--tile); border-radius: 0 10px 10px 0; font-size: 14px; }
.cluebox b { color: var(--good); font-weight: 600; }
#answer { width: 100%; font: 500 17px var(--body); color: var(--ink); background: #110f18; border: 1px solid var(--line);
  border-radius: 12px; padding: 13px 14px; margin-top: 8px; -webkit-user-select: text; user-select: text; }
#answer:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
#feedback { min-height: 1.4em; font-size: 14px; color: var(--amber); }
.small { font-size: 13px; color: var(--muted); }
#journal-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
#journal-list li { padding: 8px 10px; background: var(--tile); border-radius: 10px; font-size: 14px; -webkit-user-select: text; user-select: text; }
#journal-list b { color: var(--good); margin-right: 6px; }
#end .stars { font-size: 34px; letter-spacing: 6px; color: var(--amber); }
#end dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; margin: 10px 0; }
#end dd { margin: 0; font-weight: 600; text-align: right; }
</style>
</head>
<body>
<div id="app" data-screen="setup">
  <canvas id="view" tabindex="0" aria-label="3D maze. Drag to spin it, pinch or scroll to zoom, twist with two fingers to roll it. Tap a door to walk to it."></canvas>

  <section id="setup">
    <div>
      <a class="btn" href="index.html">&larr; Games</a>
      <h1>Riddle <span>Maze</span></h1>
    </div>
    <p class="lede">Every door is locked by a riddle. Answer it if you know it, or explore for clue tablets. The maze is new every time.</p>
    <div class="group">
      <span class="label">Difficulty</span>
      <div class="chips" id="tiers"></div>
      <p class="hint" id="tier-blurb"></p>
    </div>
    <div class="group">
      <span class="label">Token</span>
      <div class="chips" id="tokens"></div>
    </div>
    <div class="group">
      <span class="label">Token material</span>
      <div class="chips" id="tmats"></div>
    </div>
    <div class="group">
      <span class="label">Maze material</span>
      <div class="chips" id="mmats"></div>
    </div>
    <div class="group">
      <span class="label">Overhead lamp</span>
      <div class="chips" id="lamps"></div>
    </div>
    <div class="group"><button id="start" class="primary" type="button">Enter the maze</button></div>
  </section>

  <header id="hud">
    <button id="to-setup" type="button">&larr; Setup</button>
    <button id="open-journal" type="button">Journal <span id="jcount">0</span></button>
    <button id="recentre" type="button">Recentre</button>
    <dl id="stats">
      <div><dt class="label">Doors</dt><dd id="s-doors">0</dd></div>
      <div><dt class="label">Wrong</dt><dd id="s-wrong">0</dd></div>
      <div id="s-keys-box"><dt class="label">Keys</dt><dd id="s-keys">0</dd></div>
      <div id="s-oil-box"><dt class="label">Oil</dt><dd id="s-oil">0</dd></div>
    </dl>
  </header>
  <p id="status" role="status" aria-live="polite"></p>

  <div id="panel" class="card" hidden role="dialog" aria-labelledby="panel-title">
    <h2 id="panel-title">Locked door</h2>
    <p id="riddle-text"></p>
    <p id="door-hint" class="small"></p>
    <p id="door-clue" class="cluebox" hidden></p>
    <form id="answer-form" autocomplete="off">
      <input id="answer" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type your answer" aria-label="Your answer" maxlength="80">
      <p id="feedback" role="status" aria-live="polite"></p>
      <div class="row">
        <button id="submit" class="primary" type="submit">Answer</button>
        <button id="use-key" type="button" hidden>Use master key</button>
        <button id="panel-journal" type="button">Journal</button>
        <button id="walk-away" type="button">Walk away</button>
      </div>
    </form>
    <p id="tries" class="small"></p>
  </div>

  <div id="journal" class="card" hidden role="dialog" aria-labelledby="journal-title">
    <h2 id="journal-title">Journal</h2>
    <p class="small" id="journal-note"></p>
    <ul id="journal-list"></ul>
    <div class="row"><button id="close-journal" class="primary" type="button">Close</button></div>
  </div>

  <div id="note" class="card" hidden role="dialog" aria-labelledby="note-title">
    <h2 id="note-title"></h2>
    <div id="note-body"></div>
    <div class="row"><button id="close-note" class="primary" type="button">Continue</button></div>
  </div>

  <div id="end" class="card" hidden role="dialog" aria-labelledby="end-title">
    <h2 id="end-title"></h2>
    <p class="stars" id="end-stars" aria-hidden="true"></p>
    <p id="end-text"></p>
    <dl id="end-stats"></dl>
    <div class="row">
      <button id="again" class="primary" type="button">New maze</button>
      <button id="end-setup" type="button">Change setup</button>
    </div>
  </div>
</div>

<script src="three.min.js"></script>
<script src="riddles-data.js"></script>

chips('tiers', Object.keys(TIERS).map(function (k) { return [k, TIERS[k].name]; }), 'tier', blurb);
